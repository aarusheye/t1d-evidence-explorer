[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "t1d-evidence-explorer"
version = "2.1.0"
description = "Reproducible Python engine for the T1D Evidence Explorer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aarushi Singh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
t1d-evidence = "t1d_evidence.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
